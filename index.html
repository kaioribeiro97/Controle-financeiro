<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5f0c17">
<title>Meus Cartões</title>
<style>
:root{--bg:#f6f7f9;--sf:#fff;--tx:#111827;--mu:#6b7280;--ac:#5f0c17;--ac2:#f3e8ea;--bd:#e5e7eb;--on:#fff;--pos:#047857;--neg:#be123c;--wbg:#fffbeb;--wbd:#fde68a;--wtx:#92400e;--ibg:#eff6ff;--ibd:#bfdbfe;--itx:#1e40af}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--sf:#171a21;--tx:#e8eaf0;--mu:#9aa1ae;--ac:#d98a95;--ac2:#2a1a1e;--bd:#262a33;--on:#2a0a10;--pos:#34d399;--neg:#fb7185;--wbg:#2b2410;--wbd:#5a4a14;--wtx:#fcd34d;--ibg:#10213a;--ibd:#1e3a64;--itx:#93c5fd}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:1.6rem;margin:0}h2{font-size:1.05rem;margin:0 0 .15rem;display:flex;gap:.5rem;align-items:center}h3{font-size:1rem;margin:0}
#app{display:flex;min-height:100vh}
aside{width:230px;background:var(--sf);border-right:1px solid var(--bd);padding:1rem .6rem;position:sticky;top:0;height:100vh;flex:none;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:700;padding:.2rem .5rem 1rem}
.lg{background:var(--ac);color:var(--on);border-radius:10px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:.75rem}
nav{flex:1}
nav button{display:flex;width:100%;align-items:center;gap:.6rem;text-align:left;background:none;border:0;color:var(--mu);padding:.6rem .8rem;border-radius:8px;cursor:pointer;font-size:.92rem;margin-bottom:.15rem}
nav button.on{background:var(--ac);color:var(--on);font-weight:600}
.me{display:flex;align-items:center;gap:.5rem;border-top:1px solid var(--bd);padding-top:.8rem}
.me .mu{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:30px;height:30px;border-radius:50%;background:var(--ac2);color:var(--ac);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.ct{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:.8rem;padding:.7rem 1.5rem;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:4}
.srch{flex:1;max-width:460px;display:flex;align-items:center;gap:.5rem;border:1px solid var(--bd);border-radius:8px;padding:0 .7rem;color:var(--mu)}
.srch input{border:0;background:none;padding:.55rem 0;outline:none}
main{max-width:1180px;margin:0 auto;padding:1.5rem}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:1.2rem;flex-wrap:wrap}
.ms{display:flex;align-items:center;gap:.3rem;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:.2rem}
.ms b{min-width:130px;text-align:center}.ms button{background:none;border:0;color:var(--tx);cursor:pointer;padding:.35rem;border-radius:6px;display:flex}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:1.1rem;margin-bottom:1rem}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}.kp .box{margin:0}
.kl{font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--mu)}
.kv{font-size:1.55rem;font-weight:700;color:var(--ac);margin:.3rem 0 .1rem}.kv.neg{color:var(--neg)}
.ks{font-size:.78rem;color:var(--mu)}
.al{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1rem 0}
.al>div{display:flex;gap:.7rem;border-radius:10px;padding:.9rem 1rem;font-size:.9rem}
.al-w{background:var(--wbg);border:1px solid var(--wbd);color:var(--wtx)}.al-i{background:var(--ibg);border:1px solid var(--ibd);color:var(--itx)}
.al b{display:block}.hot{font-weight:700;text-decoration:underline}
.mid{display:grid;grid-template-columns:2fr 1fr;gap:1rem;align-items:start}
input,select{width:100%;padding:.55rem;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:1rem}
label{display:block;font-size:.8rem;color:var(--mu);margin:.6rem 0 .2rem}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 .8rem}
button.p,button.s,button.chip{display:inline-flex;align-items:center;gap:.4rem;font:inherit}
button.p{background:var(--ac);color:var(--on);border:0;padding:.6rem 1rem;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem}
button.s{background:none;border:1px solid var(--bd);color:var(--tx);padding:.4rem .65rem;border-radius:8px;cursor:pointer;font-size:.85rem}
button.s.d{color:var(--neg)}
.acts{display:inline-flex;gap:.3rem;margin-left:.5rem;vertical-align:middle}
.row{display:flex;justify-content:space-between;gap:.6rem;padding:.55rem 0;border-top:1px solid var(--bd);align-items:center}
.row small{color:var(--mu);display:block}
.n{font-variant-numeric:tabular-nums;white-space:nowrap}.mu{color:var(--mu)}.r{text-align:right}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);text-align:left;padding:.6rem .5rem;border-bottom:1px solid var(--bd)}
td{padding:.6rem .5rem;border-bottom:1px solid var(--bd);vertical-align:middle}
.chip{font-size:.74rem;padding:.15rem .6rem;border-radius:99px;background:var(--ac2);color:var(--ac);font-weight:600;border:0;white-space:nowrap}
.chip.ok{background:#d1fae5;color:#065f46}.chip.wn{background:#fef3c7;color:#92400e}
button.chip{cursor:pointer}
.bar{height:8px;background:var(--ac2);border-radius:4px;overflow:hidden;margin:.5rem 0 .3rem}
.bar i{display:block;height:100%;background:var(--ac)}.bar.hi i{background:var(--neg)}
.sp{display:grid;grid-template-columns:1fr 120px;gap:.4rem;margin-bottom:.4rem}
.err{color:var(--neg);font-size:.9rem;min-height:1.3em}
.cc{display:flex;gap:1rem;align-items:center;flex-direction:column}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:.5rem}
.seg{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.5rem}
.seg button{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:.5rem .9rem;cursor:pointer;font:inherit}
.seg button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.ib{width:36px;height:36px;border-radius:50%;background:var(--ac2);color:var(--ac);display:inline-flex;align-items:center;justify-content:center;flex:none}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}.hd>div:first-child{display:flex;gap:.7rem;align-items:center}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.6rem 0}
.three div{background:var(--bg);border-radius:8px;padding:.5rem .7rem}
.ic{vertical-align:-3px;flex:none}
#login{max-width:350px;margin:12vh auto}
.hide{display:none!important}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(max-width:900px){
 #app{display:block}
 aside{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;padding:.25rem;z-index:6;border-top:1px solid var(--bd);border-right:0;flex-direction:row}
 .brand,.me{display:none}nav{display:flex}
 nav button{flex-direction:column;justify-content:center;gap:.1rem;text-align:center;font-size:.66rem;padding:.4rem .1rem;margin:0}
 main{padding:1rem 1rem 6rem}.top{padding:.6rem 1rem}
 .kp{grid-template-columns:1fr 1fr}.al,.mid,.g{grid-template-columns:1fr}
 #nw span{display:none}
}
</style>
</head>
<body>

<div id="login" class="box hide">
  <h1 style="color:var(--ac)">Meus Cartões</h1>
  <label>E-mail</label><input id="em" type="email" autocomplete="username">
  <label>Senha</label><input id="pw" type="password" autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <button class="p" id="lbtn" style="width:100%;justify-content:center">Entrar</button>
</div>

<div id="app" class="hide">
  <aside>
    <div class="brand"><span class="lg">MC</span> Meus Cartões</div>
    <nav id="tabs">
      <button data-v="dash" class="on" data-ic="dash">Dashboard</button>
      <button data-v="lanc" data-ic="swap">Lançamentos</button>
      <button data-v="cart" data-ic="card">Cartões</button>
      <button data-v="pess" data-ic="users">Pessoas</button>
      <button data-v="rec" data-ic="repeat">Recorrentes</button>
      <button data-v="cfg" data-ic="gear">Config.</button>
    </nav>
    <div class="me"><span class="av" id="av"></span><span class="mu" id="who"></span><button class="s" id="out" data-ic="out" aria-label="Sair" title="Sair"></button></div>
  </aside>
  <div class="ct">
    <div class="top">
      <div class="srch"><span data-ic="search"></span><input id="q" placeholder="Buscar no sistema…" aria-label="Buscar"></div>
      <button class="p" id="nw" data-ic="plus"><span>Novo Lançamento</span></button>
    </div>
    <main>
      <div class="ph">
        <div><h1 id="pt">Dashboard</h1><div class="mu" id="ps2"></div></div>
        <div class="ms"><button id="pm" data-ic="left" aria-label="Mês anterior"></button><b id="ml"></b><button id="nm" data-ic="right" aria-label="Próximo mês"></button></div>
      </div>

      <section id="v-dash">
        <div class="kp" id="kpis"></div>
        <div class="al" id="alerts"></div>
        <div class="mid">
          <div>
            <div class="box"><h2>Receitas x Despesas</h2><div class="mu">Evolução dos últimos 6 meses</div><div id="chart"></div></div>
            <div class="box"><div class="hd" style="margin-bottom:.5rem"><h2>Últimos lançamentos</h2><button class="s" data-v2="lanc">Ver todos</button></div><div id="last"></div></div>
          </div>
          <div>
            <div class="box"><h2>Gastos por categoria</h2><div class="mu">No mês selecionado</div><div class="cc"><div id="donut"></div><div id="cats" style="width:100%"></div></div></div>
            <div class="box"><h2>Limite dos cartões</h2><div id="lims"></div></div>
          </div>
        </div>
      </section>

      <section id="v-lanc" class="hide"><div class="box" id="lt"></div></section>
      <section id="v-cart" class="hide"><div id="cc"></div></section>
      <section id="v-pess" class="hide"><div id="pp"></div></section>
      <section id="v-rec" class="hide"><div class="box" id="rl"></div></section>

      <section id="v-new" class="hide">
        <form id="f" class="box" onsubmit="return false" style="max-width:720px">
          <div class="seg" id="kseg">
            <button type="button" data-kind="card">Compra no cartão</button>
            <button type="button" data-kind="out">Despesa (Pix/Débito)</button>
            <button type="button" data-kind="in">Receita</button>
            <button type="button" data-kind="rec">Recorrente</button>
          </div>
          <h2 id="ft">Novo lançamento</h2>
          <label>Descrição</label><input id="d" placeholder="Ex.: Adidas, Salário, Netflix">
          <div class="g">
            <div><label id="dtl">Data</label><input id="dt" type="date"></div>
            <div><label id="vll">Valor (R$)</label><input id="vl" type="number" step="0.01" min="0.01"></div>
            <div data-k="card rec"><label>Cartão</label><select id="cd"></select></div>
            <div data-k="card"><label>Parcelas</label><input id="np" type="number" min="1" max="48" value="1"></div>
            <div data-k="in out rec"><label>Forma</label><select id="mt"><option>Pix</option><option>Débito</option><option>Dinheiro</option><option>Salário</option><option>Transferência</option><option>Boleto</option><option>Outro</option></select></div>
            <div data-k="rec"><label>Tipo</label><select id="rt"><option value="out">Despesa</option><option value="in">Receita</option></select></div>
            <div data-k="rec"><label>Termina em (opcional)</label><input id="en" type="month"></div>
            <div><label>Categoria</label><input id="ct" list="cl" placeholder="Moradia, Mercado..."></div>
            <div><label>Observação</label><input id="ob"></div>
          </div>
          <div data-k="card">
            <label>Quem usou (valor de cada um)</label>
            <div id="sps"></div>
            <button type="button" class="s" id="addp" data-ic="plus">Pessoa</button>
            <button type="button" class="s" id="eq" data-ic="users">Dividir igualmente</button>
            <p class="mu n" id="chk"></p>
          </div>
          <p class="mu" data-k="rec" id="rhint"></p>
          <div class="err" id="ferr"></div>
          <button class="p" id="save"><span id="sv">Salvar</span></button>
          <button type="button" class="s hide" id="cancel">Cancelar edição</button>
        </form>
        <datalist id="cl"></datalist><datalist id="pl"></datalist>
      </section>

      <section id="v-cfg" class="hide">
        <div class="box"><h2>Cartões e limites</h2><div id="cfg"></div><div style="margin-top:.8rem"><button class="s" id="addc" data-ic="plus">Novo cartão</button> <button class="p" id="scfg" data-ic="check">Salvar</button></div></div>
        <div class="box"><h2>Exportar</h2><p class="mu">Baixa compras no cartão, receitas e despesas em CSV (abre no Excel).</p><button class="p" id="exp" data-ic="download">Exportar CSV</button></div>
      </section>
    </main>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,deleteDoc,setDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB8m0PIr35ov-JckGjo6Zn68cyKg4qA11g",
  authDomain: "financeiro-3e61b.firebaseapp.com",
  projectId: "financeiro-3e61b",
  storageBucket: "financeiro-3e61b.firebasestorage.app",
  messagingSenderId: "131106903771",
  appId: "1:131106903771:web:cc48d9368a6fd074ec1efe"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(n+0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const sum=a=>a.reduce((t,x)=>t+x.amt,0);
const COL=['#5f0c17','#f59e0b','#3b82f6','#10b981','#8b5cf6','#06b6d4','#ec4899','#9ca3af'];
const DEF={inter:{name:'Inter',close:5,due:10,limit:0},nubank:{name:'Nubank',close:12,due:19,limit:0}};
const I={dash:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',swap:'<path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>',repeat:'<path d="M17 2l3 3-3 3M4 11V9a4 4 0 014-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 01-4 4H4"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',plus:'<path d="M12 5v14M5 12h14"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14c2.5.7 3.5 2.7 3.5 6"/>',card:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6 15h4"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',left:'<path d="M15 5l-7 7 7 7"/>',right:'<path d="M9 5l7 7-7 7"/>',out:'<path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/>',wallet:'<path d="M3 7h16a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M3 7l12-3v3M17 14h2"/>'};
const ic=(n,z=18)=>`<svg class="ic" viewBox="0 0 24 24" width="${z}" height="${z}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const act=(k,id)=>`<span class="acts"><button class="s" data-ed="${k}:${id}" title="Editar" aria-label="Editar">${ic('edit',15)}</button><button class="s d" data-rm="${k}:${id}" title="Excluir" aria-label="Excluir">${ic('trash',15)}</button></span>`;
const lab=k=>{const[y,m]=k.split('-').map(Number),t=new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).replace(' de ',' de ');return t[0].toUpperCase()+t.slice(1)};
const MS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const iso=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fd=d=>d.split('-').reverse().join('/');
const isMe=n=>/^eu$/i.test(String(n).trim());
const COLK={card:'purchases',rec:'recs',recb:'recs',tx:'tx',pay:'pays'};

let uid,cards=structuredClone(DEF),paid={},S={purchases:[],tx:[],recs:[],pays:[]},unsubs=[],editing=null,M='',mSet=0,openM='',view='dash',kind='card',Q='',RV=[];

// ---------- datas e faturas ----------
const mk=(y,m)=>{const d=new Date(y,m,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const addM=(k,n)=>{const[y,m]=k.split('-').map(Number);return mk(y,m-1+n)};
const invOf=(card,date)=>{const[y,m,d]=date.split('-').map(Number);return mk(y,m-1+(d>cards[card].close?1:0))};
const first=p=>invOf(p.card,p.date);
const dueDate=(k,inv)=>{const[y,m]=inv.split('-').map(Number),c=cards[k];return new Date(y,m-1+(c.due<=c.close?1:0),c.due)};
const sp=(v,n)=>{const t=Math.round(v*100),b=Math.floor(t/n),r=t-b*n;return Array.from({length:n},(_,i)=>(b+(i<r?1:0))/100)};
const occ=(r,mm)=>{if(mm<r.start||(r.end&&mm>r.end))return null;const[y,m]=mm.split('-').map(Number);return mm+'-'+String(Math.min(r.day,new Date(y,m,0).getDate())).padStart(2,'0')};
const isPaid=(k,inv)=>!!paid[k+'_'+inv];
const today=()=>new Date(new Date().toDateString());
const nextD=d=>{const T=today();for(let i=0;i<2;i++){const y=T.getFullYear(),m=T.getMonth()+i,t=new Date(y,m,Math.min(d,new Date(y,m+1,0).getDate()));if(t>=T)return t}};
const dl=t=>Math.round((t-today())/864e5);
const when=t=>(dl(t)===0?'hoje':dl(t)===1?'amanhã':`em ${dl(t)} dias`)+` (${String(t.getDate()).padStart(2,'0')}/${String(t.getMonth()+1).padStart(2,'0')})`;
const hl=t=>`<span class="${dl(t)<=3?'hot':''}">${when(t)}</span>`;

function items(){
  const o=[];
  for(const p of S.purchases){
    if(!cards[p.card])continue;
    const f=first(p),tot=sp(p.total,p.n),sh=p.splits.map(s=>({who:s.person,a:sp(s.amount,p.n)}));
    for(let i=0;i<p.n;i++)o.push({p,i,inv:addM(f,i),amt:tot[i],sh:sh.map(s=>({who:s.who,amt:s.a[i]}))});
  }
  const end=addM(M||openM||mk(new Date().getFullYear(),new Date().getMonth()),6);
  for(const r of S.recs){
    if(!r.card||r.type!=='out'||!cards[r.card])continue;
    for(let mm=r.start,n=0;mm<=end&&n<120;mm=addM(mm,1),n++){
      const d=occ(r,mm);if(!d)continue;
      const p={id:r.id,rec:true,desc:r.desc,date:d,card:r.card,category:r.category,note:r.note,n:1,total:r.amount,splits:[{person:'Eu',amount:r.amount}]};
      o.push({p,i:0,inv:invOf(r.card,d),amt:r.amount,sh:[{who:'Eu',amt:r.amount}],rec:true});
    }
  }
  return o;
}
const parc=x=>x.rec?'Recorrente':x.p.n>1?`Parcela ${x.i+1}/${x.p.n}`:'Compra única';
const usedOf=(k,all)=>sum(all.filter(x=>x.p.card===k&&!isPaid(k,x.inv)&&(!x.rec||x.inv<=openM)));

// linhas unificadas do mês: cartão, receitas/despesas, recorrentes, recebimentos
function rows(mm,all){
  const R=[];
  all.filter(x=>x.inv===mm).forEach(x=>R.push({k:x.rec?'rec':'card',id:x.p.id,date:x.p.date,desc:x.p.desc+(x.p.n>1?` (${x.i+1}/${x.p.n})`:''),cat:x.p.category,ctx:cards[x.p.card].name,v:-x.amt,st:isPaid(x.p.card,mm)?'Paga':'Fatura aberta'}));
  S.tx.filter(t=>t.date.slice(0,7)===mm).forEach(t=>R.push({k:'tx',id:t.id,date:t.date,desc:t.desc,cat:t.category,ctx:t.method,v:t.type==='in'?t.amount:-t.amount,st:'Efetivado'}));
  S.recs.filter(r=>!(r.card&&r.type==='out')).forEach(r=>{const d=occ(r,mm);if(!d)return;const key='rec_'+r.id+'_'+mm,ok=paid[key];R.push({k:'recb',id:r.id,date:d,desc:r.desc,cat:r.category,ctx:r.method||'Recorrente',v:r.type==='in'?r.amount:-r.amount,st:ok?(r.type==='in'?'Recebido':'Pago'):'Pendente',key})});
  S.pays.filter(p=>p.date.slice(0,7)===mm).forEach(p=>R.push({k:'pay',id:p.id,date:p.date,desc:'Recebido de '+p.person,cat:'Reembolso',ctx:'Pessoas',v:p.amount,st:'Recebido'}));
  return R.sort((a,b)=>b.date.localeCompare(a.date));
}
const tot=R=>({in:R.filter(r=>r.v>0).reduce((t,r)=>t+r.v,0),out:-R.filter(r=>r.v<0).reduce((t,r)=>t+r.v,0)});

function recv(all){
  const m={},g=w=>m[w]??={who:w,owed:0,got:0,items:[]};
  all.filter(x=>x.inv===M).forEach(x=>x.sh.forEach(s=>{if(isMe(s.who))return;const o=g(s.who);o.owed+=s.amt;o.items.push({x,amt:s.amt})}));
  S.pays.filter(p=>p.month===M).forEach(p=>g(p.person).got+=p.amount);
  return Object.values(m).map(o=>({...o,owed:Math.round(o.owed*100)/100,got:Math.round(o.got*100)/100,falta:Math.round((o.owed-o.got)*100)/100})).sort((a,b)=>b.falta-a.falta);
}
const stmt=o=>`${o.who} — fatura ${lab(M)}\n`+o.items.map(({x,amt})=>`${x.p.desc} - ${brl(amt)} - ${parc(x)} (${cards[x.p.card].name})`).join('\n')+`\n\nTotal: ${brl(o.owed)}`+(o.got?`\nJá pago: ${brl(o.got)}\nFalta: ${brl(o.falta)}`:'');

// ---------- gráficos ----------
function donut(en,t){let off=0;return `<svg viewBox="0 0 42 42" width="170" height="170" role="img" aria-label="Gastos por categoria"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--ac2)" stroke-width="6"/>`+
  en.map(([c,v],i)=>{const p=v/t*100,s=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${COL[i%8]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-off}"/>`;off+=p;return s}).join('')+`</svg>`}
function line(ms,A,B){
  const W=620,H=210,P=34,mx=Math.max(1,...A,...B),X=i=>P+i*(W-P-10)/(ms.length-1),Y=v=>H-26-v/mx*(H-46),pt=a=>a.map((v,i)=>X(i)+','+Y(v)).join(' ');
  const k=v=>v>=1000?(v/1000).toFixed(v%1000?1:0).replace('.',',')+'k':Math.round(v);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Receitas e despesas por mês">`+
   [0,.25,.5,.75,1].map(f=>`<line x1="${P}" x2="${W-10}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="var(--bd)"/><text x="${P-6}" y="${Y(mx*f)+4}" text-anchor="end" font-size="10" fill="var(--mu)">${k(mx*f)}</text>`).join('')+
   `<polygon points="${X(0)},${Y(0)} ${pt(B)} ${X(ms.length-1)},${Y(0)}" fill="#e11d48" opacity=".08"/>`+
   `<polyline points="${pt(A)}" fill="none" stroke="#059669" stroke-width="2.5"/><polyline points="${pt(B)}" fill="none" stroke="#e11d48" stroke-width="2.5"/>`+
   ms.map((m,i)=>`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--mu)">${MS[+m.slice(5)-1]}</text>`).join('')+
   `<text x="${W-150}" y="12" font-size="11" fill="#059669">● Receitas</text><text x="${W-80}" y="12" font-size="11" fill="#e11d48">● Despesas</text></svg>`}

// ---------- tabelas ----------
const chip=r=>r.k==='recb'?`<button class="chip ${r.st==='Pendente'?'wn':'ok'}" data-tg="${r.key}" title="Clique para alternar">${r.st}</button>`:`<span class="chip ${r.st==='Fatura aberta'?'wn':'ok'}">${r.st}</span>`;
const racts=r=>r.k==='pay'?`<span class="acts"><button class="s d" data-rm="pay:${r.id}" aria-label="Excluir">${ic('trash',15)}</button></span>`:act(r.k,r.id);
const tbl=(L,a=1)=>`<div class="tw"><table><thead><tr><th>Descrição</th><th>Categoria</th><th>Contexto</th><th>Data</th><th class="r">Valor</th><th>Status</th>${a?'<th></th>':''}</tr></thead><tbody>${L.map(r=>`<tr><td>${esc(r.desc)}</td><td>${esc(r.cat||'—')}</td><td>${esc(r.ctx||'')}</td><td class="n">${fd(r.date)}</td><td class="r n ${r.v>0?'pos':''}">${r.v>0?'+':'−'} ${brl(Math.abs(r.v))}</td><td>${chip(r)}</td>${a?`<td class="r n">${racts(r)}</td>`:''}</tr>`).join('')||'<tr><td colspan="7" class="mu">Nenhum lançamento neste mês.</td></tr>'}</tbody></table></div>`;

// ---------- telas ----------
function render(){
  if(!M)return;
  $('#ml').textContent=lab(M);
  const all=items(),R=rows(M,all),T=tot(R),Tp=tot(rows(addM(M,-1),all));
  RV=recv(all);
  dash(all,R,T,Tp);
  const L=Q?R.filter(r=>(r.desc+' '+(r.cat||'')+' '+(r.ctx||'')).toLowerCase().includes(Q)):R,t2=tot(L);
  $('#lt').innerHTML=`<div class="mu" style="margin-bottom:.5rem">${L.length} lançamento(s)${Q?` para “${esc(Q)}”`:''} · Receitas <b class="pos n">${brl(t2.in)}</b> · Despesas <b class="neg n">${brl(t2.out)}</b></div>`+tbl(L);
  cart(all);pess();recl();
  $('#pl').innerHTML=[...new Set(S.purchases.flatMap(p=>p.splits.map(s=>s.person)))].map(p=>`<option value="${esc(p)}">`).join('');
  $('#cl').innerHTML=[...new Set([...S.purchases,...S.tx,...S.recs].map(p=>p.category).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('');
}

function dash(all,R,T,Tp){
  const comp=R.filter(r=>r.v<0&&(r.st==='Fatura aberta'||r.st==='Pendente')).reduce((t,r)=>t-r.v,0),sal=T.in-T.out;
  const dlt=(a,b,inv)=>b?`<span class="${(a>=b)!==inv?'pos':'neg'}">${a>=b?'▲':'▼'} ${Math.abs((a-b)/b*100).toFixed(1).replace('.',',')}% em relação ao mês anterior</span>`:'Sem dados do mês anterior';
  $('#kpis').innerHTML=[['Saldo do mês',brl(sal),'Receitas − despesas',sal<0?'neg':''],['Receitas do mês',brl(T.in),dlt(T.in,Tp.in,0)],['Despesas do mês',brl(T.out),dlt(T.out,Tp.out,1)],['Valor comprometido',brl(comp),'Faturas abertas + contas pendentes']]
    .map(([a,b,c,z])=>`<div class="box"><div class="kl">${a}</div><div class="kv n ${z||''}">${b}</div><div class="ks">${c}</div></div>`).join('');

  const lim=Object.entries(cards).map(([k,c])=>({c,u:usedOf(k,all)})).filter(o=>o.c.limit>0&&o.u/o.c.limit>=.8);
  const rem=Object.values(cards).map(c=>`<b style="display:inline">${esc(c.name)}</b>: fecha ${hl(nextD(c.close))} · vence ${hl(nextD(c.due))}`);
  S.recs.filter(r=>!(r.card&&r.type==='out')).forEach(r=>{const t=nextD(r.day),key=mk(t.getFullYear(),t.getMonth());if(dl(t)<=7&&occ(r,key)&&!paid['rec_'+r.id+'_'+key])rem.push(`${r.type==='in'?'Receber':'Pagar'} <b style="display:inline">${esc(r.desc)}</b> (${brl(r.amount)}) ${hl(t)}`)});
  RV.filter(o=>o.falta>0).forEach(o=>rem.push(`A receber de <b style="display:inline">${esc(o.who)}</b>: ${brl(o.falta)}`));
  const noLim=Object.values(cards).every(c=>!c.limit);
  $('#alerts').innerHTML=`<div class="al-w">${ic('alert',20)}<div><b>Alerta de limite</b>${lim.length?lim.map(o=>`<div>${esc(o.c.name)} atingiu <b style="display:inline">${Math.round(o.u/o.c.limit*100)}%</b> do limite. Considere reduzir os gastos neste cartão.</div>`).join(''):`<div>${noLim?'Defina o limite dos cartões em Config. para receber alertas.':'Nenhum cartão acima de 80% do limite.'}</div>`}</div></div><div class="al-i">${ic('clock',20)}<div><b>Lembretes</b>${rem.map(x=>`<div>${x}</div>`).join('')}</div></div>`;

  const ms=[-5,-4,-3,-2,-1,0].map(i=>addM(M,i)),tt=ms.map(m=>tot(rows(m,all)));
  $('#chart').innerHTML=line(ms,tt.map(x=>x.in),tt.map(x=>x.out));
  $('#last').innerHTML=tbl(R.slice(0,6),0);
  const byCat={};R.filter(r=>r.v<0).forEach(r=>{const c=r.cat||'Sem categoria';byCat[c]=(byCat[c]||0)-r.v});
  const en=Object.entries(byCat).sort((a,b)=>b[1]-a[1]),t=T.out;
  $('#donut').innerHTML=t?donut(en,t):'<p class="mu">Sem gastos neste mês.</p>';
  $('#cats').innerHTML=en.map(([c,v],i)=>`<div class="row"><span><span class="dot" style="background:${COL[i%8]}"></span>${esc(c)}</span><b class="n">${Math.round(v/t*100)}%</b></div>`).join('');
  $('#lims').innerHTML=Object.entries(cards).map(([k,c])=>{const u=usedOf(k,all),p=c.limit?u/c.limit*100:0;return `<div style="margin-bottom:.8rem"><div class="row" style="border:0;padding:0"><span>${esc(c.name)}</span><span class="n mu">${c.limit?Math.round(p)+'%':'sem limite'}</span></div><div class="bar ${p>=80?'hi':''}"><i style="width:${Math.min(100,p)}%"></i></div><div class="mu n">Usado ${brl(u)}${c.limit?' de '+brl(c.limit):''}</div></div>`}).join('');
}

function cart(all){
  $('#cc').innerHTML=Object.entries(cards).map(([k,c])=>{
    const L=all.filter(x=>x.inv===M&&x.p.card===k),t=sum(L),pg=isPaid(k,M),u=usedOf(k,all),pc=c.limit?Math.min(100,u/c.limit*100):0;
    return `<div class="box"><div class="hd"><div><span class="ib">${ic('card',20)}</span><div><h3>${esc(c.name)}</h3><div class="mu">Fecha dia ${c.close} (${hl(nextD(c.close))}) · vence dia ${c.due} (${hl(nextD(c.due))})</div></div></div><span class="chip ${pg||!t?'ok':'wn'}">${!t?'Sem fatura':pg?'Paga':'Em aberto'}</span></div>
      <div class="kv n" style="color:var(--tx)">${brl(t)}</div>
      <div class="bar ${pc>=80?'hi':''}"><i style="width:${pc}%"></i></div>
      <div class="mu n">${c.limit?`Disponível ${brl(c.limit-u)} · limite ${brl(c.limit)} · usado ${brl(u)}`:`Usado ${brl(u)} · defina o limite em Config.`}</div>
      ${t?`<button class="s" data-pay="${k}" style="margin:.7rem 0">${ic('check',15)} ${pg?'Desmarcar como paga':'Marcar fatura como paga'}</button>`:''}
      ${L.map(x=>`<div class="row"><div>${esc(x.p.desc)}<small>${parc(x)}${x.p.category?' · '+esc(x.p.category):''} · ${x.sh.map(s=>esc(s.who)).join(', ')}${x.p.note?' · '+esc(x.p.note):''}</small></div><div class="n">${brl(x.amt)}${act(x.rec?'rec':'card',x.p.id)}</div></div>`).join('')||'<p class="mu">Nenhuma compra nesta fatura.</p>'}</div>`}).join('');
}

function pess(){
  $('#pp').innerHTML=RV.map((o,i)=>{
    const st=o.falta<=0.005?'Quitado':o.got>0?'Parcial':'Em aberto',pc=o.owed?Math.min(100,o.got/o.owed*100):0,ps=S.pays.filter(p=>p.person===o.who&&p.month===M);
    return `<div class="box"><div class="hd"><div><span class="ib">${ic('user',20)}</span><h3>${esc(o.who)}</h3></div><span class="chip ${st==='Quitado'?'ok':'wn'}">${st}</span></div>
      <div class="three"><div><div class="kl">Deve</div><b class="n">${brl(o.owed)}</b></div><div><div class="kl">Já pagou</div><b class="n pos">${brl(o.got)}</b></div><div><div class="kl">Falta</div><b class="n ${o.falta>0?'neg':''}">${brl(Math.max(0,o.falta))}</b></div></div>
      <div class="bar"><i style="width:${pc}%"></i></div>
      <div style="display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0">${o.falta>0?`<button class="p" data-full="${i}" style="margin:0">${ic('check',15)} Quitar tudo</button><button class="s" data-rcv="${i}">${ic('wallet',15)} Registrar valor</button>`:''}<button class="s" data-copy="${i}">${ic('copy',15)} Copiar cobrança</button></div>
      ${o.items.map(({x,amt})=>`<div class="row"><div>${esc(x.p.desc)}<small>${parc(x)} · ${esc(cards[x.p.card].name)}</small></div><b class="n">${brl(amt)}</b></div>`).join('')}
      ${ps.map(p=>`<div class="row"><div class="pos">Recebido em ${fd(p.date)}</div><div class="n pos">+ ${brl(p.amount)}<span class="acts"><button class="s d" data-rm="pay:${p.id}" aria-label="Excluir">${ic('trash',15)}</button></span></div></div>`).join('')}</div>`}).join('')||'<div class="box mu">Ninguém além de você usou os cartões nesta fatura.</div>';
}

function recl(){
  $('#rl').innerHTML=`<div class="hd" style="margin-bottom:.5rem"><h2>Contas e assinaturas fixas</h2><button class="p" data-newrec style="margin:0">${ic('plus',15)} Nova recorrente</button></div><p class="mu">Elas aparecem sozinhas em todos os meses, a partir da data inicial, sem precisar lançar de novo.</p>`+
   (S.recs.map(r=>`<div class="row"><div>${esc(r.desc)}<small>${r.type==='in'?'Receita':'Despesa'} · todo dia ${r.day} · ${r.card&&cards[r.card]?esc(cards[r.card].name):esc(r.method||'')} · desde ${r.start.slice(5)}/${r.start.slice(0,4)}${r.end?' até '+r.end.slice(5)+'/'+r.end.slice(0,4):''}</small></div><div class="n ${r.type==='in'?'pos':''}">${brl(r.amount)}${act('rec',r.id)}</div></div>`).join('')||'<p class="mu">Nenhuma recorrente cadastrada.</p>');
}

// ---------- formulário ----------
const KL={card:'Compra no cartão',out:'Despesa',in:'Receita',rec:'Conta recorrente'};
function fillCd(){const s=$('#cd'),v=s.value;s.innerHTML=(kind==='rec'?'<option value="">Sem cartão (Pix/débito/boleto)</option>':'')+Object.entries(cards).map(([k,c])=>`<option value="${k}">${esc(c.name)}</option>`).join('');if([...s.options].some(o=>o.value===v))s.value=v}
function setKind(k){
  kind=k;
  document.querySelectorAll('#kseg button').forEach(b=>b.classList.toggle('on',b.dataset.kind===k));
  document.querySelectorAll('#f [data-k]').forEach(e=>e.classList.toggle('hide',!e.dataset.k.split(' ').includes(k)));
  $('#dtl').textContent=k==='rec'?'Começa em':'Data';$('#vll').textContent=k==='card'?'Valor total (R$)':'Valor (R$)';
  $('#rhint').textContent='Repete todo mês no mesmo dia da data inicial. Se escolher um cartão, entra na fatura dele (assinaturas).';
  $('#kseg').classList.toggle('hide',!!editing);$('#cd').innerHTML='';fillCd();
}
const spRow=(p='',a='')=>{const d=document.createElement('div');d.className='sp';d.innerHTML=`<input list="pl" placeholder="Nome (ex.: Eu, Juliana)" value="${esc(p)}"><input type="number" step="0.01" min="0" placeholder="Valor" value="${a}">`;d.oninput=chk;$('#sps').append(d)};
const rows2=()=>[...$('#sps').children].map(d=>({person:d.children[0].value.trim(),amount:Math.round(parseFloat(d.children[1].value||0)*100)/100})).filter(r=>r.person);
function chk(){const t=parseFloat($('#vl').value||0),s=rows2().reduce((a,r)=>a+r.amount,0),df=Math.round((t-s)*100)/100;
  $('#chk').textContent=`Soma: ${brl(s)} de ${brl(t)}`+(df?` — falta ${brl(df)}`:' ✓');$('#chk').style.color=df?'#b45309':'var(--pos)'}
function resetForm(k='card'){editing=null;$('#f').reset();$('#sps').innerHTML='';spRow();spRow();$('#np').value=1;$('#dt').value=iso();$('#ft').textContent='Novo lançamento';$('#sv').textContent='Salvar';$('#cancel').classList.add('hide');$('#ferr').textContent='';setKind(k);chk()}
function startEdit(k,id){
  const col=COLK[k],r=S[col].find(x=>x.id===id);if(!r)return;
  const kd=col==='purchases'?'card':col==='recs'?'rec':r.type;
  resetForm(kd);editing={col,id};setKind(kd);
  $('#d').value=r.desc;$('#ct').value=r.category||'';$('#ob').value=r.note||'';
  if(kd==='card'){$('#dt').value=r.date;$('#cd').value=r.card;$('#vl').value=r.total;$('#np').value=r.n;$('#sps').innerHTML='';r.splits.forEach(s=>spRow(s.person,s.amount))}
  else if(kd==='rec'){$('#dt').value=r.start+'-'+String(r.day).padStart(2,'0');$('#vl').value=r.amount;$('#rt').value=r.type;$('#en').value=r.end||'';$('#mt').value=r.method||'Pix';$('#cd').value=r.card||''}
  else{$('#dt').value=r.date;$('#vl').value=r.amount;$('#mt').value=r.method||'Pix'}
  $('#ft').textContent='Editar '+KL[kd].toLowerCase();$('#sv').textContent='Salvar alterações';$('#cancel').classList.remove('hide');chk();go('new');
}
$('#kseg').onclick=e=>{const b=e.target.closest('[data-kind]');if(b)setKind(b.dataset.kind)};
$('#addp').onclick=()=>spRow();$('#vl').oninput=chk;
$('#cancel').onclick=()=>go('dash');
$('#eq').onclick=()=>{const r=[...$('#sps').children].filter(d=>d.children[0].value.trim()),t=parseFloat($('#vl').value||0);if(!r.length)return;const a=sp(t,r.length);r.forEach((d,i)=>d.children[1].value=a[i]);chk()};
$('#save').onclick=async()=>{
  const e=$('#ferr');e.textContent='';
  const v=Math.round(parseFloat($('#vl').value)*100)/100,d=$('#d').value.trim(),dt=$('#dt').value;
  if(!d||!dt||!(v>0))return e.textContent='Preencha descrição, data e valor.';
  const base={desc:d,category:$('#ct').value.trim(),note:$('#ob').value.trim()};let col,data,nm=M;
  if(kind==='card'){
    const splits=rows2();
    if(!splits.length)return e.textContent='Informe ao menos uma pessoa.';
    if(Math.abs(splits.reduce((a,r)=>a+r.amount,0)-v)>0.009)return e.textContent='A soma das pessoas precisa ser igual ao total.';
    col='purchases';data={...base,date:dt,card:$('#cd').value,total:v,n:Math.max(1,parseInt($('#np').value)||1),splits};nm=first(data);
  }else if(kind==='rec'){
    col='recs';data={...base,amount:v,type:$('#rt').value,day:+dt.slice(8),start:dt.slice(0,7),end:$('#en').value||'',method:$('#mt').value,card:$('#cd').value};
  }else{col='tx';data={...base,type:kind,amount:v,date:dt,method:$('#mt').value};nm=dt.slice(0,7)}
  try{
    if(editing)await setDoc(doc(db,'users',uid,col,editing.id),data);else await addDoc(collection(db,'users',uid,col),data);
    M=nm;resetForm();go(kind==='rec'?'rec':'dash');render();
  }catch{e.textContent='Não foi possível salvar. Verifique a conexão e as regras do Firestore.'}
};

// ---------- cartões e exportação ----------
function drawCfg(){
  $('#cfg').innerHTML=Object.entries(cards).map(([k,c])=>`<div class="g" data-k2="${k}" style="border-top:1px solid var(--bd);margin-top:.8rem;padding-top:.3rem">
   <div style="grid-column:1/-1"><label>Nome do cartão</label><input value="${esc(c.name)}" data-f="name"></div>
   <div><label>Dia de fechamento</label><input type="number" min="1" max="31" value="${c.close}" data-f="close"></div>
   <div><label>Dia de vencimento</label><input type="number" min="1" max="31" value="${c.due}" data-f="due"></div>
   <div style="grid-column:1/-1"><label>Limite (R$)</label><input type="number" step="0.01" value="${c.limit}" data-f="limit"></div>
   <div style="grid-column:1/-1"><button class="s d" data-delcard="${k}" style="margin-top:.6rem">${ic('trash',15)} Excluir cartão</button></div></div>`).join('');

}
const saveCards=()=>setDoc(doc(db,'users',uid,'config','cards'),cards);
const readCfg=()=>document.querySelectorAll('#cfg [data-k2]').forEach(g=>g.querySelectorAll('[data-f]').forEach(i=>cards[g.dataset.k2][i.dataset.f]=i.dataset.f==='name'?(i.value.trim()||'Cartão'):parseFloat(i.value)||0));

$('#addc').onclick=async()=>{readCfg();cards['c'+Date.now()]={name:'Novo cartão',close:1,due:10,limit:0};await saveCards()};
$('#exp').onclick=()=>{
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',f=v=>v.toFixed(2).replace('.',',');
  const H=['Tipo','Fatura/Data','Data da compra','Descrição','Cartão/Forma','Parcela','Valor','Pessoas','Categoria','Observação'];
  const L=[...items().sort((a,b)=>a.inv.localeCompare(b.inv)).map(x=>['Cartão',x.inv,x.p.date,x.p.desc,cards[x.p.card].name,parc(x),f(x.amt),x.sh.map(s=>s.who+' '+f(s.amt)).join(' | '),x.p.category,x.p.note]),
    ...S.tx.map(t=>[t.type==='in'?'Receita':'Despesa',t.date.slice(0,7),t.date,t.desc,t.method,'',f(t.amount),'',t.category,t.note]),
    ...S.pays.map(p=>['Recebimento',p.month,p.date,'Recebido de '+p.person,'','',f(p.amount),p.person,'',''])].map(r=>r.map(q).join(';'));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+[H.map(q).join(';'),...L].join('\n')],{type:'text/csv'}));a.download='financeiro.csv';a.click();
};

// ---------- navegação e eventos ----------
const V={dash:['Dashboard','Visão geral do mês'],lanc:['Lançamentos','Tudo que entrou e saiu no mês'],cart:['Cartões de Crédito','Faturas, limites e vencimentos'],pess:['Pessoas','Quem usou seus cartões e quem já pagou'],rec:['Contas recorrentes','Assinaturas e contas fixas lançadas todo mês'],new:['Novo lançamento','Cartão, despesa, receita ou conta recorrente'],cfg:['Configurações','Cartões, limites e exportação']};
function go(v){
  if(v!=='new'&&editing)resetForm();
  view=v;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  Object.keys(V).forEach(x=>$('#v-'+x).classList.toggle('hide',x!==v));
  $('#pt').textContent=V[v][0];$('#ps2').textContent=V[v][1];
  document.querySelector('.ms').classList.toggle('hide',['new','rec','cfg'].includes(v));
  scrollTo(0,0);
}
$('#tabs').onclick=e=>{const b=e.target.closest('[data-v]');if(b){if(b.dataset.v!=='lanc'){Q='';$('#q').value=''}go(b.dataset.v);render()}};
$('#nw').onclick=()=>{resetForm('card');go('new')};
$('#q').oninput=e=>{Q=e.target.value.trim().toLowerCase();if(Q&&view!=='lanc')go('lanc');render()};
$('#pm').onclick=()=>{M=addM(M,-1);render()};$('#nm').onclick=()=>{M=addM(M,1);render()};
const pathD=(col,id)=>doc(db,'users',uid,col,id);
document.addEventListener('click',async e=>{
  const g=q=>e.target.closest(q);let el;
  if(el=g('[data-v2]')){go(el.dataset.v2);render()}
  else if(el=g('[data-newrec]')){resetForm('rec');go('new')}
  else if(el=g('[data-ed]')){const[k,id]=el.dataset.ed.split(':');startEdit(k,id)}
  else if(el=g('[data-rm]')){const[k,id]=el.dataset.rm.split(':');if(confirm(k==='card'?'Excluir esta compra (todas as parcelas)?':k==='rec'||k==='recb'?'Excluir esta conta recorrente (todos os meses)?':'Excluir este lançamento?'))await deleteDoc(pathD(COLK[k],id))}
  else if(el=g('[data-tg]')){const k=el.dataset.tg;await setDoc(doc(db,'users',uid,'config','paid'),{[k]:!paid[k]},{merge:true})}
  else if(el=g('[data-pay]')){const k=el.dataset.pay+'_'+M;await setDoc(doc(db,'users',uid,'config','paid'),{[k]:!paid[k]},{merge:true})}
  else if(el=g('[data-full]')){const o=RV[+el.dataset.full];await addDoc(collection(db,'users',uid,'pays'),{person:o.who,month:M,amount:o.falta,date:iso()})}
  else if(el=g('[data-rcv]')){const o=RV[+el.dataset.rcv],v=parseFloat(String(prompt(`Valor recebido de ${o.who} (R$):`,o.falta.toFixed(2))||'').replace(',','.'));if(v>0)await addDoc(collection(db,'users',uid,'pays'),{person:o.who,month:M,amount:Math.round(v*100)/100,date:iso()})}
  else if(el=g('[data-copy]')){await navigator.clipboard.writeText(stmt(RV[+el.dataset.copy]));el.textContent='Copiado'}
  else if(el=g('[data-delcard]')){const k=el.dataset.delcard;
    if(S.purchases.some(p=>p.card===k)||S.recs.some(r=>r.card===k))return alert('Este cartão tem compras ou recorrentes cadastradas. Exclua ou edite antes de removê-lo.');
    if(confirm('Excluir este cartão?')){readCfg();delete cards[k];await saveCards()}}
});
$('#lbtn').onclick=async()=>{$('#lerr').textContent='';try{await signInWithEmailAndPassword(auth,$('#em').value,$('#pw').value)}catch{$('#lerr').textContent='E-mail ou senha incorretos.'}};
$('#pw').onkeydown=e=>e.key==='Enter'&&$('#lbtn').click();
$('#out').onclick=()=>signOut(auth);
document.querySelectorAll('[data-ic]').forEach(e=>e.insertAdjacentHTML('afterbegin',ic(e.dataset.ic)+(e.textContent.trim()?' ':'')));

onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];
  $('#login').classList.toggle('hide',!!u);$('#app').classList.toggle('hide',!u);
  if(!u){S={purchases:[],tx:[],recs:[],pays:[]};return}
  uid=u.uid;mSet=0;const n=new Date();M=mk(n.getFullYear(),n.getMonth());
  $('#av').textContent=(u.email||'?')[0].toUpperCase();$('#who').textContent=u.email||'';
  resetForm();go('dash');
  unsubs.push(onSnapshot(doc(db,'users',uid,'config','cards'),s=>{
    cards=s.exists()?s.data():structuredClone(DEF);
    if(!mSet){mSet=1;openM=mk(n.getFullYear(),n.getMonth()+(n.getDate()>Math.min(...Object.values(cards).map(c=>c.close))?1:0));M=openM}
    drawCfg();render()}));
  unsubs.push(onSnapshot(doc(db,'users',uid,'config','paid'),s=>{paid=s.exists()?s.data():{};render()}));
  ['purchases','tx','recs','pays'].forEach(c=>unsubs.push(onSnapshot(collection(db,'users',uid,c),s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));render()})));
});
</script>
</body>
</html>
